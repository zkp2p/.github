          receipt = dict(target=str(target), inode=info.st_ino, uid=info.st_uid, gid=info.st_gid,
                         mode=info.st_mode, sha256=hashlib.sha256(target.read_bytes()).hexdigest(), fixed=fixed)
          Path(os.environ['RUNNER_TEMP'], 'node24-before.json').write_text(json.dumps(receipt))
          print(json.dumps(receipt))
          PYCODE
      - name: Patch via remote action
        uses: zkp2p/.github/actions/patch-node24@f92953ec391e7d36896b8f9eea4dd3406e40346f
      - name: Verify JavaScript action uses fixed runtime
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
