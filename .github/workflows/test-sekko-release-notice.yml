name: Sekko release notice checks

on:
  pull_request:
    paths:
      - actions/sekko-release-notice/**
      - scripts/test-sekko-release-notice.py
      - scripts/test-ssm-deploy.py
      - .github/workflows/ssm-deploy.yml
      - .github/workflows/test-sekko-release-notice.yml
      - docs/sekko-release-notices.md
  push:
    branches: [main]
    paths:
      - actions/sekko-release-notice/**
      - scripts/test-sekko-release-notice.py
      - scripts/test-ssm-deploy.py
      - .github/workflows/ssm-deploy.yml
      - .github/workflows/test-sekko-release-notice.yml
      - docs/sekko-release-notices.md

permissions:
  contents: read

jobs:
  release-notices:
    name: Native notice and deploy gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Patch hosted action runtime
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4
      - name: Check out proposed patch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test notice contracts and recovery artifacts
        run: python3 -B scripts/test-sekko-release-notice.py
      - name: Test actual Docker and yq deploy harness
        run: python3 -B scripts/test-ssm-deploy.py
      - name: Lint workflows with checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/sekko-actionlint.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          archive="$scratch/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --retry 2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$scratch" actionlint
          "$scratch/actionlint" .github/workflows/*.yml
