name: SSM deploy

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      artifact-kind:
        description: Artifact identity kind (docker or eif); EIF requires SSM_DEPLOY_EIF_ENABLED=true.
        type: string
        default: docker
      artifact-key:
        type: string
        required: true
      manifest-sha256:
        type: string
        required: true
      image-id:
        type: string
        required: true
      source-sha:
        type: string
        required: true
      allow-key-removal:
        type: boolean
        default: false
      environments-file:
        type: string
        default: deploy/environments.yml
      ci-workflow:
        type: string
        default: ci.yml
      ci-tree-reuse:
        description: Allow successful CI for an identical Git tree to satisfy the gate.
        type: boolean
        default: false
      host-timeout-seconds:
        description: Maximum seconds to follow the host command (integer, 600..6600).
        type: number
        default: 3900
      runner:
        type: string
        default: ubuntu-latest
    secrets:
      slack-webhook-url:
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    # Cover resolution, the CI gate and the maximum host follow with existing margins.
    timeout-minutes: 190
    permissions:
      contents: read
      actions: write
      id-token: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      MODE: ${{ inputs.mode }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AWS_PAGER: ''
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
    steps:
      - name: Validate artifact identity
        env:
          MODE: ${{ inputs.mode }}
          ARTIFACT_KIND: ${{ inputs.artifact-kind }}
          IMAGE_ID: ${{ inputs.image-id }}
          ALLOW_KEY_REMOVAL: ${{ inputs.allow-key-removal }}
          EIF_ENABLED: ${{ vars.SSM_DEPLOY_EIF_ENABLED }}
        run: |
          set -euo pipefail
          # Reject incompatible identities before checkout, CI dispatch or AWS access.
          case "$ARTIFACT_KIND" in
            docker|eif) ;;
            *) echo 'artifact-kind must be docker or eif' >&2; exit 1 ;;
          esac
          case "$MODE" in
            image)
              if [[ "$ARTIFACT_KIND" == docker ]]; then
                identity_pattern='^sha256:[a-f0-9]{64}$'
              else
                identity_pattern='^pcr0:[a-f0-9]{96}$'
              fi
              if [[ ! "$IMAGE_ID" =~ $identity_pattern ]]; then
                echo 'image-id must match artifact-kind (docker: sha256:<64 lowercase hex>; eif: pcr0:<96 lowercase hex>)' >&2
                exit 1
              fi
              ;;
            parent)
              if [[ "$ARTIFACT_KIND" != eif ]]; then
                echo 'parent mode requires artifact-kind=eif' >&2
                exit 1
              fi
              if [[ ! "$IMAGE_ID" =~ ^parent:[a-f0-9]{64}$ ]]; then
                echo 'parent mode requires image-id=parent:<64 lowercase hex>' >&2
                exit 1
              fi
              ;;
            config|config-plan)
              if [[ "$ARTIFACT_KIND" != docker ]]; then
                echo 'config and config-plan require artifact-kind=docker' >&2
                exit 1
              fi
              ;;
            *) echo 'Invalid mode' >&2; exit 1 ;;
          esac
          if [[ "$ARTIFACT_KIND" == eif ]]; then
            if [[ "$ALLOW_KEY_REMOVAL" != false ]]; then
              echo 'EIF deploy requires allow-key-removal=false' >&2
              exit 1
            fi
            if [[ "$EIF_ENABLED" != true ]]; then
              echo 'EIF deploy is disabled; operators must set caller repository variable SSM_DEPLOY_EIF_ENABLED=true after staging prerequisites are complete' >&2
              exit 1
            fi
          fi
      - name: Patch hosted action runtime
        if: runner.environment == 'github-hosted'
        uses: zkp2p/.github/actions/patch-node24@4ef0030bb0aca98a6c4a6378dbf48ad159ff25d4 # reviewed runtime patch
      - name: Validate host timeout
        id: timeouts
        env:
          HOST_TIMEOUT_SECONDS: ${{ inputs.host-timeout-seconds }}
        run: |
          set -euo pipefail
          # Leave 600 seconds for delivery and pre-follow steps within the deploy
          # role's 7200-second session so CloudWatch access does not expire mid-follow.
          if [[ ! "$HOST_TIMEOUT_SECONDS" =~ ^[1-9][0-9]{2,4}$ ]] ||
             (( HOST_TIMEOUT_SECONDS < 600 || HOST_TIMEOUT_SECONDS > 6600 )); then
            echo 'host-timeout-seconds must be an integer between 600 and 6600' >&2
            exit 1
          fi
          # Round up, retaining the existing 1-minute follow and 15-minute job margins.
          minutes=$(( (HOST_TIMEOUT_SECONDS + 59) / 60 ))
          printf 'follow-timeout-minutes=%s\ndeploy-timeout-minutes=%s\n' \
            "$((minutes + 1))" "$((minutes + 15))" >> "$GITHUB_OUTPUT"
      - name: Check out caller environment map
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: ${{ inputs.environments-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve environment
        id: resolve
        env:
          ENVIRONMENTS_FILE: ${{ inputs.environments-file }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if command -v yq >/dev/null 2>&1; then
            yq_version=$(yq --version)
            if [[ "$yq_version" != *mikefarah* && ! "$yq_version" =~ version[[:space:]]v4([.]|$) ]]; then
              echo 'Installed yq must be mikefarah/yq v4' >&2
              exit 1
            fi
            yq_command=(yq)
          else
            yq_command=(docker run --rm -v "$PWD:/w:ro" -w /w mikefarah/yq:4.44.3)
          fi
          config=$("${yq_command[@]}" \
            -o=json "./$ENVIRONMENTS_FILE" 2>/dev/null) || {
            echo 'Could not read environments-file' >&2
            exit 1
          }
          matches=$(jq -ce --arg ref "$REF" \
            '[.environments | to_entries[] | select(.value.branch == $ref)]' <<< "$config")
          count=$(jq 'length' <<< "$matches")
          if [[ "$count" == 0 ]]; then
            printf 'No deploy environment for %s\n' "$REF" >&2
            exit 1
          fi
          if [[ "$count" != 1 ]]; then
            echo 'Multiple deploy environments match the branch' >&2
            exit 1
          fi
          outputs=$(jq -cen --argjson config "$config" --argjson match "$matches" '
            {
              environment: $match[0].key,
              "instance-id": $match[0].value.instanceId,
              "role-arn": $match[0].value.roleArn,
              region: ($match[0].value.region // $config.region),
              document: ($match[0].value.ssmDocument // $config.ssmDocument),
              "log-group": ($match[0].value.logGroup // $config.logGroup),
              ci: $match[0].value.ci
            }
            | if all(.[]; type == "string" and length > 0 and (test("[\\r\\n]") | not))
                and (.ci == "required" or .ci == "skip")
              then . else error("Invalid environment configuration") end
          ')
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$outputs" >> "$GITHUB_OUTPUT"
      - name: Wait for CI on the image commit
        id: decide
        if: steps.resolve.outputs.ci == 'required' && (inputs.mode == 'image' || inputs.mode == 'parent')
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.source-sha }}
          REF: ${{ github.ref_name }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          CI_TREE_REUSE: ${{ inputs.ci-tree-reuse }}
          DECISION_JQ: |
            .workflow_runs
            | if type != "array" then error("Missing workflow_runs")
              elif any(.[]; .status == "completed" and .conclusion == "success") then "pass"
              elif any(.[]; .status != "completed") then "wait"
              elif length > 0 then "fail"
              else "dispatch"
              end
          RUNNER_LOSS_JQ: |
            [.[].jobs[]]
            | any(.[]; .conclusion == "failure" or .conclusion == "cancelled")
              and all(.[]; (.steps | type == "array")
                and all(.steps[]; .conclusion != "failure"))
          TREE_REUSE_JQ: |
            .workflow_runs
            | if type != "array" then error("Missing workflow_runs") else . end
            | [.[] | select(.status == "completed" and .conclusion == "success"
                and .head_commit.tree_id == $tree)
              | select(.html_url | type == "string" and length > 0)
              | select(.head_sha | type == "string" and length == 40 and test("^[a-fA-F0-9]{40}$"))]
            | .[0] // empty
            | [.html_url, .head_sha] | @tsv
        run: |
          set -euo pipefail
          started=$(date +%s)
          dispatched=false
          poll=0
          reused_run=''
          while (( $(date +%s) - started < 2700 )); do
            runs=$(timeout 60s gh api \
              "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$SHA&per_page=20" \
              2>/dev/null) || {
              echo 'Could not read CI runs' >&2
              exit 1
            }
            decision=$(jq -er "$DECISION_JQ" <<< "$runs")
            if [[ "$decision" != pass && "$CI_TREE_REUSE" == true ]] && (( poll % 5 == 0 )); then
              if commit=$(timeout 60s gh api "repos/$REPO/git/commits/$SHA" 2>/dev/null) &&
                 tree=$(jq -er '.tree.sha | select(type == "string" and length == 40
                   and test("^[a-fA-F0-9]{40}$"))' <<< "$commit" 2>/dev/null) &&
                 successes=$(timeout 60s gh api \
                   "repos/$REPO/actions/workflows/$CI_WORKFLOW/runs?status=success&per_page=100" \
                   2>/dev/null) &&
                 reused_run=$(jq -er --arg tree "$tree" "$TREE_REUSE_JQ" <<< "$successes" 2>/dev/null); then
                decision='pass'
              fi
            fi
            poll=$((poll + 1))
            if [[ "$decision" == fail ]]; then
              if failed_run=$(jq -er '
                .workflow_runs | max_by(.created_at, .id)
                | select(.id | type == "number")
                | select(.run_attempt == 1 or .run_attempt == 2)
                | [.id, .run_attempt, (.updated_at | fromdateiso8601)] | @tsv
              ' <<< "$runs" 2>/dev/null); then
                read -r run_id run_attempt updated_at <<< "$failed_run"
                if (( $(date +%s) < updated_at + 600 )) &&
                   jobs=$(timeout 60s gh api --paginate --slurp \
                     "repos/$REPO/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100" \
                     2>/dev/null) &&
                   jq -e "$RUNNER_LOSS_JQ" <<< "$jobs" >/dev/null 2>&1 &&
                   (( $(date +%s) < updated_at + 600 )); then
                  printf 'CI run %s attempt %s: runner-loss grace; waiting up to 10 minutes after %s\n' \
                    "$run_id" "$run_attempt" "$(jq -r '.workflow_runs | max_by(.created_at, .id) | .updated_at' <<< "$runs")"
                  decision='wait'
                fi
              fi
            fi
            if (( $(date +%s) - started >= 2700 )); then
              break
            fi
            case "$decision" in
              pass)
                if [[ -n "$reused_run" ]]; then
                  read -r reused_url reused_sha <<< "$reused_run"
                  printf 'Reusing successful CI run %s (head_sha %s)\n' "$reused_url" "$reused_sha"
                fi
                exit 0
                ;;
              fail) echo 'CI failed for the image commit' >&2; exit 1 ;;
              wait) ;;
              dispatch)
                if [[ "$dispatched" == false ]]; then
                  timeout 60s gh workflow run "$CI_WORKFLOW" --ref "$REF" --repo "$REPO" \
                    >/dev/null 2>&1 || {
                    echo 'Could not dispatch CI' >&2
                    exit 1
                  }
                  dispatched=true
                fi
                ;;
              *) echo 'Invalid CI decision' >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo 'CI did not pass within 45 minutes' >&2
          exit 1
      - name: Normalize deploy parameters
        id: normalize
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          ARTIFACT_KEY: ${{ inputs.artifact-key }}
          MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
          IMAGE_ID: ${{ inputs.image-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          ALLOW_KEY_REMOVAL: ${{ inputs.allow-key-removal }}
          # The caller's run: hosts name their per-attempt receipts after it.
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$MODE" in
            image|parent)
              for key in ARTIFACT_KEY MANIFEST_SHA256 IMAGE_ID SOURCE_SHA; do
                if [[ -z "${!key}" || "${!key}" == none ]]; then
                  printf 'Image deploy requires %s\n' "$key" >&2
                  exit 1
                fi
              done
              # Artifact identity was already validated against artifact-kind.
              if [[ ! "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ||
                    ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
                echo 'Invalid MANIFEST_SHA256 or SOURCE_SHA' >&2
                exit 1
              fi
              if [[ "$MODE" == parent ]]; then
                case "$DEPLOY_ENVIRONMENT" in
                  staging) parent_prefix='zkp2p/attestation-service/parent/' ;;
                  prod) parent_prefix='zkp2p/attestation-service/prod/parent/' ;;
                  *) echo 'parent mode requires staging or prod' >&2; exit 1 ;;
                esac
                if [[ "$ARTIFACT_KEY" != "${parent_prefix}${MANIFEST_SHA256}/parent-bundle.tar.gz" ]]; then
                  echo 'Invalid parent artifact-key for environment or manifest' >&2
                  exit 1
                fi
              elif [[ "$ARTIFACT_KEY" == zkp2p/attestation-service/parent/* ||
                      "$ARTIFACT_KEY" == zkp2p/attestation-service/prod/parent/* ]]; then
                echo 'Parent artifact-key requires parent mode' >&2
                exit 1
              fi
              ;;
            config|config-plan)
              ARTIFACT_KEY=none
              MANIFEST_SHA256=none
              IMAGE_ID=none
              SOURCE_SHA=none
              ;;
            *) echo 'Invalid mode' >&2; exit 1 ;;
          esac
          case "$ALLOW_KEY_REMOVAL" in
            true|false) ;;
            *) echo 'Invalid ALLOW_KEY_REMOVAL' >&2; exit 1 ;;
          esac
          umask 077
          jq -n --arg mode "$MODE" --arg artifact "$ARTIFACT_KEY" \
            --arg manifest "$MANIFEST_SHA256" --arg image "$IMAGE_ID" \
            --arg source "$SOURCE_SHA" --arg allow "$ALLOW_KEY_REMOVAL" \
            --arg run "$RUN_ID" --arg attempt "$RUN_ATTEMPT" \
            '{Mode: [$mode], ArtifactKey: [$artifact], ManifestSha256: [$manifest],
              ImageId: [$image], SourceSha: [$source], AllowKeyRemoval: [$allow],
              RunId: [$run], RunAttempt: [$attempt]}' \
            > "$RUNNER_TEMP/ssm-parameters.json"
      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.resolve.outputs.role-arn }}
          aws-region: ${{ steps.resolve.outputs.region }}
          role-session-name: deploy-${{ github.event.repository.name }}-${{ github.run_id }}
          role-duration-seconds: 7200
          mask-aws-account-id: true
          unset-current-credentials: true
          retry-max-attempts: 3
          action-timeout-s: 120
      - name: Create GitHub deployment
        id: deployment
        if: inputs.mode != 'config-plan'
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
        run: |
          set -euo pipefail
          task=deploy
          if [[ "$MODE" == config ]]; then
            task=deploy:config
          fi
          deployment=$(jq -n --arg ref "$SHA" --arg environment "$DEPLOY_ENVIRONMENT" \
            --arg task "$task" --arg description "$MODE deploy of ${SHA:0:7}" \
            '{ref: $ref, environment: $environment, task: $task, description: $description,
              auto_merge: false, required_contexts: []}' \
            | timeout 60s gh api --method POST "repos/$REPO/deployments" --input - 2>/dev/null) || {
            echo 'Could not create GitHub deployment' >&2
            exit 1
          }
          deployment_id=$(jq -er '.id | select(type == "number")' <<< "$deployment")
          printf 'id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          timeout 60s gh api --method POST "repos/$REPO/deployments/$deployment_id/statuses" \
            -f state=in_progress -f log_url="$RUN_URL" >/dev/null 2>&1 || {
            echo 'Could not mark deployment in progress' >&2
            exit 1
          }
      - name: Send SSM command
        id: command
        env:
          DOCUMENT: ${{ steps.resolve.outputs.document }}
          INSTANCE_ID: ${{ steps.resolve.outputs.instance-id }}
          LOG_GROUP: ${{ steps.resolve.outputs.log-group }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          started_at=$(( $(date +%s) * 1000 ))
          command_id=$(timeout 60s aws ssm send-command \
            --document-name "$DOCUMENT" --instance-ids "$INSTANCE_ID" \
            --timeout-seconds 600 --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true,CloudWatchLogGroupName=$LOG_GROUP" \
            --comment "$REPO@${SHA:0:7} $MODE run $RUN_ID" \
            --query 'Command.CommandId' --output text 2>/dev/null) || {
            echo 'Could not send SSM command' >&2
            exit 1
          }
          if [[ ! "$command_id" =~ ^[a-f0-9-]{36}$ ]]; then
            echo 'Invalid SSM command ID' >&2
            exit 1
          fi
          printf 'command-id=%s\nstarted-at=%s\n' "$command_id" "$started_at" >> "$GITHUB_OUTPUT"
      - name: Follow command logs
        id: poll
        timeout-minutes: ${{ fromJSON(steps.timeouts.outputs.follow-timeout-minutes) }}
        env:
          COMMAND_ID: ${{ steps.command.outputs.command-id }}
          STARTED_AT: ${{ steps.command.outputs.started-at }}
          LOG_GROUP: ${{ steps.resolve.outputs.log-group }}
          HOST_TIMEOUT_SECONDS: ${{ inputs.host-timeout-seconds }}
        run: |
          set -euo pipefail
          started=$((STARTED_AT / 1000))
          seen='[]'
          received=false
          final_drain=false
          deploy_exit=''
          # Late ingestion can put new events before any previously seen timestamp.
          log_args=(--log-group-name "$LOG_GROUP" --log-stream-name-prefix "$COMMAND_ID/"
            --start-time "$STARTED_AT" --no-paginate --output json)
          while (( $(date +%s) - started < HOST_TIMEOUT_SECONDS )); do
            events='[]'
            page_args=("${log_args[@]}")
            while :; do
              if (( $(date +%s) - started >= HOST_TIMEOUT_SECONDS )); then
                break 2
              fi
              response=$(timeout 60s aws logs filter-log-events "${page_args[@]}" 2>/dev/null) || {
                echo 'Could not read command logs' >&2
                exit 1
              }
              events=$(jq -ce --argjson events "$events" '$events + .events' <<< "$response")
              next_token=$(jq -r '.nextToken // empty' <<< "$response")
              if [[ -z "$next_token" ]]; then
                break
              fi
              page_args=("${log_args[@]}" --next-token "$next_token")
            done
            events=$(jq -ce --argjson seen "$seen" '
              [.[] | select(.eventId as $id | $seen | index($id) | not)]
              | unique_by(.eventId) | sort_by(.timestamp, .eventId)
            ' <<< "$events")
            if [[ $(jq 'length' <<< "$events") != 0 ]]; then
              received=true
              stop_token=$(openssl rand -hex 16)
              printf '::stop-commands::%s\n' "$stop_token"
              jq -r '.[].message' <<< "$events"
              printf '::%s::\n' "$stop_token"
              seen=$(jq -c --argjson seen "$seen" '$seen + [.[].eventId] | unique' <<< "$events")
            fi
            if [[ "$final_drain" == true ]]; then
              if [[ "$deploy_exit" != 0 ]]; then
                echo 'SSM deploy failed' >&2
              fi
              exit "$deploy_exit"
            fi
            if deploy_exit=$(jq -er '
              [.[].message | scan("\\{\\s*\"deployExit\"\\s*:\\s*([0-9]+)\\s*\\}") | .[0] | tonumber]
              | if length > 0 then .[-1] else empty end
            ' <<< "$events"); then
              # Give both stdout and stderr time to ingest, then read every page once more.
              final_drain=true
              sleep 10
              continue
            fi
            if [[ "$received" == false ]] && (( $(date +%s) - started >= 600 )); then
              echo 'Command was not delivered (agent offline?)' >&2
              exit 1
            fi
            sleep 15
          done
          printf 'No deployExit marker within %s seconds\n' "$HOST_TIMEOUT_SECONDS" >&2
          exit 1
      - name: Record deployment result
        id: status
        if: always() && steps.deployment.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          RESULT: ${{ steps.poll.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          description="$MODE deploy failed"
          if [[ "$RESULT" == success ]]; then
            description="$MODE deploy succeeded"
          fi
          timeout 60s gh api --method POST "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$RESULT" -f log_url="$RUN_URL" -f description="$description" >/dev/null 2>&1 || {
            echo 'Could not record deployment result' >&2
            exit 1
          }
      - name: Notify Slack if configured
        if: always() && steps.normalize.outcome != 'skipped'
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          RESULT: ${{ steps.poll.outcome == 'success' && (inputs.mode == 'config-plan' || steps.status.outcome == 'success') && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            exit 0
          fi
          jq -n --arg text "$REPO $DEPLOY_ENVIRONMENT $MODE ${SHA:0:7} $RESULT $RUN_URL" \
            '{text: $text}' | curl --silent --fail --connect-timeout 10 --max-time 30 \
              -H 'Content-Type: application/json' --data-binary @- "$SLACK_WEBHOOK_URL" \
              >/dev/null 2>&1 || {
              echo '::warning::Could not send deploy notification'
              exit 0
            }
      - name: Require successful deploy
        if: always() && steps.normalize.outcome != 'skipped'
        env:
          RESULT: ${{ steps.poll.outcome == 'success' && (inputs.mode == 'config-plan' || steps.status.outcome == 'success') && 'success' || 'failure' }}
        run: test "$RESULT" = success
