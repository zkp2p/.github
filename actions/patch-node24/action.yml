name: Patch hosted action Node 24
description: Patch bundled Node 24 and verify Ubuntu native Brotli, rebuilding only on 24.04
runs:
  using: composite
  steps:
    - name: Patch the runner's bundled Node 24
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/patch-node24.sh"
    - name: Patch Ubuntu native Brotli
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/patch-native-brotli.py"
